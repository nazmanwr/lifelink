<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#b91c3c">
  <meta name="description" content="LifeLink connects blood donors with people who need blood, matched by blood group and sorted by distance.">
  <title>LifeLink — Blood Donor Connect</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🩸</text></svg>">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="is-loading">
  <a class="skip-link" href="#main">Skip to content</a>

  <header id="app-header" class="header is-signed-out">
    <a class="brand" href="#/home">
      <span class="brand__mark" aria-hidden="true">🩸</span>
      <span class="brand__name">LifeLink</span>
    </a>
    <nav id="nav" class="nav" aria-label="Main"></nav>
  </header>

  <main id="main" class="main" tabindex="-1"></main>

  <footer class="footer">
    <p>LifeLink · a prototype. Always follow your local blood bank's screening rules before donating.</p>
  </footer>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <noscript>
    <p style="padding:2rem;text-align:center">LifeLink needs JavaScript enabled to run.</p>
  </noscript>

  <!-- Classic scripts (not modules) so the app also runs from file:// -->
  <script src="js/blood.js"></script>
  <script src="js/geo.js"></script>
  <script src="js/store.js"></script>
  <script src="js/match.js"></script>
  <script src="js/seed.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/views.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
